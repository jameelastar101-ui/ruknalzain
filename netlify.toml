[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Acoustic hub slug history: /acoustic-flooring-solutions -> /acoustic-flooring
# -> /acoustic-soundproofing-flooring. Redirect every old slug to the current
# one to preserve external links / existing index coverage.
[[redirects]]
  from = "/acoustic-flooring-solutions"
  to = "/acoustic-soundproofing-flooring"
  status = 301
  force = true

[[redirects]]
  from = "/acoustic-flooring"
  to = "/acoustic-soundproofing-flooring"
  status = 301
  force = true

# Astro emits pages as files (trailingSlash: 'never', build.format: 'file').
# Keep Netlify from forcing a trailing slash so URLs stay canonical.
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301
  force = false
