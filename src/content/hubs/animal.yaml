faqs:
  - question: Why put rubber flooring in a stable or on a farm?
    answer: >-
      Rubber matting gives animals a non-slip, cushioned surface over concrete or
      compacted ground. That reduces leg fatigue and joint strain, lowers the
      risk of slips and injuries, insulates against slab temperature and makes
      daily mucking out and washing down faster.
  - question: Which product suits stalls versus walkways?
    answer: >-
      Use Zain Horse Mats and Zain Hammer Top inside stalls and high-traffic
      barn areas; use Dog Bone and Hexagon pavers for outdoor walkways, garden
      paths and paddock routes where an interlocking, drainable surface is
      needed.
  - question: Do rubber mats and pavers hold up in UAE heat?
    answer: >-
      Recycled rubber is dimensionally stable and weather-resistant, and it
      insulates against the temperature of the slab or ground beneath it. It is
      widely used outdoors and in un-air-conditioned barns across the region.
  - question: Can I order in bulk or wholesale quantities?
    answer: >-
      Yes. Submit a bulk or wholesale enquiry with your quantities and project
      location and we will provide pricing, available sizes and the technical
      specification sheet for each product.
