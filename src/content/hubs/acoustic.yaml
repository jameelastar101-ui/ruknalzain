faqs:
  - question: How fast can Rukn Al Zain deliver acoustic materials to project sites in Dubai?
    answer: >-
      We dispatch orders directly from our central Dubai warehouse, delivering to
      site locations across Dubai within 24 to 48 hours.
  - question: Does Rukn Al Zain provide technical sample kits and data sheets for specifiers?
    answer: >-
      Yes, we provide physical product samples and technical datasheets directly
      to acoustic consultants, architects, and contractors across the UAE.
  - question: What is the difference between ZainAcoustic Underlay and ZainSilence?
    answer: >-
      ZainAcoustic Underlay is designed for thin application directly beneath
      floor finishes like tile, marble, or wood. ZainSilence is a heavy-duty mat
      engineered to sit beneath wet concrete screeds to support high structural
      loads.
  - question: Can ZainAcoustic underlay be installed under natural marble and porcelain tile?
    answer: >-
      Yes, ZainAcoustic underlayment is engineered for installation beneath hard
      surface flooring, providing impact noise reduction without creating joint
      movement.
  - question: How do rubber acoustic underlays reduce sound transfer between building floors?
    answer: >-
      Rubber underlays act as a resilient layer between the subfloor and finished
      flooring, absorbing kinetic impact energy before it can travel through the
      concrete slab as sound.
  - question: Why is perimeter edge isolation necessary when installing acoustic underlayment?
    answer: >-
      Using self-adhesive acoustic strips along wall perimeters prevents the floor
      finish from touching vertical walls, blocking flanking noise paths.
  - question: How do Dubai indoor air-conditioning cycles affect floor underlayment stability?
    answer: >-
      Frequent air-conditioning continuous cycles cause temperature fluctuations
      that warp low-grade materials. Our underlays use non-degrading polyurethane
      binders to stay dimensionally flat.
  - question: Why are recycled rubber acoustic underlays preferred for construction projects in the UAE?
    answer: >-
      Recycled rubber provides long-term compression resistance under heavy loads
      while supporting green building sustainability goals across GCC developments.
