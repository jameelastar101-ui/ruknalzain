faqs:
  - question: Should I choose rubber tiles or rubber rolls for a gym?
    answer: >-
      Tiles are easier to transport, install and replace in sections, which suits
      home gyms, multi-use rooms and phased fit-outs. Rolls give a more seamless
      surface with fewer joints, which suits large permanent commercial floors.
      Zain Duo combines a performance roll surface over a rubber tile base.
  - question: What gym flooring is best for a heavy weightlifting area?
    answer: >-
      Zain Extreme heavy-duty tiles are built for extreme loads and repeated
      weight drops, absorbing impact and noise in dedicated lifting and CrossFit
      zones. Pair them with Zain Curb Stones to protect mirrors, glass and
      equipment.
  - question: Can gym flooring be installed over concrete?
    answer: >-
      Yes. Zain Square tiles glue directly to a prepared concrete slab, Zain Fit
      tiles lay loose or interlocked, and Zain Active Rolls can be loose-laid or
      bonded. The slab should be clean, level and dry before installation.
  - question: Do you supply samples and quotes for gym projects?
    answer: >-
      Yes. Request a free sample and a project quote and we will confirm formats,
      thicknesses and colours for your space, along with the technical
      specification sheet for each product.
