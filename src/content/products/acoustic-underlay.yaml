tagline: Recycled-rubber acoustic underlay for floors in multi-storey buildings.

definition: >-
  Zain Acoustic Underlay is a recycled-rubber sheet laid between the structural
  slab and the floor finish to cut impact sound — footsteps, dropped objects,
  moving furniture — passing to the unit below. It is used under tile, stone,
  timber and laminate finishes in apartments, hotels and offices.

benefits:
  - Absorbs impact shock before it transmits to the floor below
  - Non-slip working surface during installation
  - Made from recyclable rubber
  - Available in multiple thicknesses to suit the acoustic target

applications:
  - Apartments and residential towers
  - Hotels and serviced apartments
  - Offices and commercial fit-outs

