installation: >-
  Lay over a clean, level, dry subfloor. Turn the underlay up at the perimeter,
  or combine with the Zain Acoustic Strip, so the finished floor does not bridge
  to the walls. Follow the finish manufacturer's build-up for tile, stone or
  timber over resilient layers.

faqs:
  - question: Does Zain Acoustic Underlay work under tile, marble and wood floors?
    answer: >-
      Yes. It is designed to sit under hard and resilient finishes including
      ceramic and porcelain tile, natural stone and marble, engineered timber and
      laminate. The finish is installed over the underlay following that
      finish's build-up for resilient layers.
  - question: How much noise does it reduce?
    answer: >-
      Impact sound reduction depends on the underlay thickness and the full floor
      build-up. The tested figures (ΔLw / IIC) are listed on the product
      technical specification sheet — request the current sheet and we will
      confirm the value for the thickness you need.
  - question: Where is acoustic underlay required in UAE buildings?
    answer: >-
      It is specified between separately owned or occupied units in multi-storey
      residential, hotel and mixed-use buildings, and wherever a project's
      acoustic report sets an impact-sound target for the floor.
  - question: Is it available in different thicknesses?
    answer: >-
      Yes, it is supplied in multiple thicknesses so the specification can be
      matched to the acoustic target and the available floor build-up depth.
      Contact us with your target and build-up and we will advise.
