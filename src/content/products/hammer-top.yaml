faqs:
  - question: How is Hammer Top different from Zain Horse Mats?
    answer: >-
      Zain Horse Mats are aimed at the stall itself — the surface a single animal
      stands and lies on. Hammer Top is aimed at shared high-traffic areas —
      aisles, wash bays and passages — with a hammered top texture built for
      constant movement of animals, barrows and equipment.
  - question: Where should Hammer Top be used?
    answer: >-
      In the parts of a stable or farm that see the most wear: circulation
      aisles, wash and grooming bays, feed passages and routes used by
      wheelbarrows, feed carts and small machinery.
  - question: Does the texture help with grip?
    answer: >-
      Yes. The hammered top pattern gives traction for hooves and wheels,
      including when the surface is wet in a wash bay.
  - question: What sizes and thicknesses are available?
    answer: >-
      Request the Zain Hammer Top specification sheet for the current mat sizes,
      thickness options and pattern detail, plus pricing for larger areas.
