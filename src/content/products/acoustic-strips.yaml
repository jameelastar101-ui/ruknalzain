installation: >-
  Peel and stick the strip to the top of decking joists or battens before fixing
  the boards, or run it vertically around the room perimeter before laying a
  floating floor. Keep the finished floor from touching the walls directly.

faqs:
  - question: What are the two main uses for the acoustic strip?
    answer: >-
      First, under timber decking — the strip sits on top of the joists or
      battens so the boards are isolated from the frame. Second, as perimeter
      isolation — it runs around the edge of a room so a floating screed or
      floating floor does not make hard contact with the walls.
  - question: How is it fixed in place?
    answer: >-
      It has a self-adhesive backing. You peel the liner and press the strip onto
      a clean, dry surface, so no separate fixings or adhesive are required.
  - question: What is it made from?
    answer: >-
      Recycled tyre rubber, which gives it the resilience needed for vibration
      isolation while reusing end-of-life tyres.
  - question: Can it be used with your acoustic underlay?
    answer: >-
      Yes. It is commonly used as the perimeter detail for a Zain Acoustic
      Underlay or Zain Silence floor, completing the isolation around the edges of
      the room.
