tagline: Self-adhesive recycled-rubber strip for perimeter and under-batten isolation.

definition: >-
  The Zain Acoustic Strip is a self-adhesive strip of recycled tyre rubber used
  in two ways: laid under timber decking joists and battens to isolate them from
  the structure, and run around the room perimeter so a floating floor does not
  bridge to the walls. Both uses cut transmitted sound and vibration.

benefits:
  - Self-adhesive backing for fast, simple installation
  - Made from recycled tyre rubber
  - Reduces structure-borne sound and vibration transfer
  - Works alongside Zain Acoustic Underlay and floating screeds

applications:
  - Timber decking and raised batten floors
  - Wall perimeter isolation alongside acoustic underlays

