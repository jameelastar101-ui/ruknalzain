installation: >-
  Lay the isolation layer over the structural slab with sealed joints, turn it up
  at all upstands and penetrations, then pour the floating screed on top. Keep
  the screed separated from walls and columns at the perimeter.

faqs:
  - question: What is screed isolation and why do premium projects use it?
    answer: >-
      Screed isolation places a resilient layer between the slab and the screed
      so the screed and finish "float" clear of the structure. That break stops
      impact energy passing into the building frame, which is how high-end
      residential and hotel projects hit demanding acoustic targets.
  - question: Can it take heavy floor loads?
    answer: >-
      Yes. Zain Silence is a high-load-bearing isolation product intended to carry
      sustained floor loading without excessive compression. Confirm the specific
      load capacity for your build-up against the technical specification sheet.
  - question: What is it made from?
    answer: >-
      Recycled crumb rubber, which reuses end-of-life tyre and industrial rubber
      and gives the layer its combination of resilience and load capacity.
  - question: How do I get the technical data sheet?
    answer: >-
      Request the Zain Silence technical data sheet and we will send the current
      thickness options and load figures, along with build-up guidance for your
      project.
