tagline: Load-bearing recycled crumb-rubber layer that isolates a floating screed.

definition: >-
  Zain Silence is a screed isolation layer made from recycled crumb rubber. It is
  laid over the structural slab so the sand-cement or self-levelling screed above
  it "floats" — separated from the structure — which gives strong impact sound
  insulation while still carrying heavy floor loads.

benefits:
  - High load-bearing performance under sustained pressure
  - Strong impact sound insulation for a floating screed build-up
  - Made from recycled crumb rubber

