definition: >-
  Zain Duo is a two-layer fitness flooring system. A durable Performance Rubber
  Roll forms the top surface for grip and wear, and an SBR rubber tile base sits
  underneath for shock absorption and comfort. It is used in commercial gyms,
  boutique studios and home gyms.

