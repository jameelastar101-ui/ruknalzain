faqs:
  - question: What is the "Duo" in Zain Duo?
    answer: >-
      Two layers working together: a Performance Rubber Roll on top for a hard-
      wearing, grippy surface, and an SBR rubber tile base beneath it for shock
      absorption and comfort. You get the durability of a roll and the cushioning
      of a tile system in one build-up.
  - question: What is it best suited to?
    answer: >-
      General gym floors where you want one system across the room — commercial
      gyms, boutique studios and home gyms. For dedicated heavy drop zones,
      combine it with or substitute Zain Extreme tiles.
  - question: What colours are available?
    answer: >-
      Zain Duo is offered in a range of colours for the roll surface. Request
      colour samples and we will send the current options and lead times.
  - question: How do I get the layer thicknesses?
    answer: >-
      Request the Zain Duo specification sheet. It lists the current roll surface
      thickness, tile base thickness and total system height.
