faqs:
  - question: What makes Zain Extreme suitable for heavy load areas?
    answer: >-
      It is a dense, thick rubber tile made to take repeated impact from heavy
      weight drops without breaking down. That density is what lets it absorb the
      shock and noise while protecting the slab underneath.
  - question: Where should Zain Extreme be used in a gym?
    answer: >-
      In the highest-load areas: barbell lifting and drop platforms, strongman
      and CrossFit stations, and any zone where loaded bars are dropped from
      height. Lighter areas can use Zain Square or Zain Fit.
  - question: Does it help with noise as well as impact?
    answer: >-
      Yes. The same mass and density that absorb the physical impact also cut the
      structure-borne noise from weight drops travelling to neighbouring units.
  - question: How do I confirm thickness and load rating?
    answer: >-
      Request the Zain Extreme specification sheet. It lists the current
      thickness, density and maximum load rating so you can match it to your
      lifting setup.
