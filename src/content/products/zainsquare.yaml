tagline: Glue-down square rubber tiles for a permanent, seamless-looking gym floor.

definition: >-
  Zain Square is a square recycled-rubber gym tile that bonds directly to a
  prepared concrete slab. Because every tile is square it can be laid in any
  pattern, and the glue-down fixing gives a permanent floor with a tight,
  near-seamless appearance.

benefits:
  - Square format lays in any pattern or orientation
  - Glue-down fixing for a permanent, high-adhesion floor
  - Tighter joints and a more seamless look than loose-lay tiles

applications:
  - Commercial gyms
  - CrossFit boxes
  - Studios needing a permanent floor

