installation: >-
  Bond to a clean, level, dry concrete slab with the recommended adhesive. Set
  out from the centre of the room so cut tiles fall evenly at the perimeter.
  Allow the adhesive to cure before heavy use.

faqs:
  - question: How is Zain Square fixed to the floor?
    answer: >-
      It is glued down to a prepared concrete slab with a recommended adhesive.
      This makes it a permanent installation, unlike loose-lay tiles, and keeps
      the joints tight under heavy use.
  - question: Can the tiles be laid in a pattern?
    answer: >-
      Yes. Because the tiles are square they can be rotated and arranged in any
      pattern — running bond, quarter-turn or straight grid — including
      two-colour layouts.
  - question: What surface do I need underneath?
    answer: >-
      A clean, level and dry concrete slab. Fill low spots and remove dust,
      curing compounds and old adhesive so the bond holds.
  - question: Where do I get the tile size, thickness and adhesive details?
    answer: >-
      Request the Zain Square specification sheet. It lists the current tile size,
      thickness options, colours and the recommended adhesive for a glue-down
      installation.
