faqs:
  - question: What is the difference between SBR and EPDM in these rolls?
    answer: >-
      SBR granules form the hard-wearing, cost-effective base of the roll. EPDM
      granules are colour-stable and UV-resistant and are used where appearance
      and colour retention matter, often as a top layer. Zain Active Rolls use
      SBR with EPDM options.
  - question: Why choose rolls instead of tiles?
    answer: >-
      Rolls cover large areas quickly with far fewer joints, which gives a
      cleaner surface and fewer edges to lift. Tiles are easier to handle in
      small spaces and to replace in sections.
  - question: What industries use Zain Active Rolls?
    answer: >-
      Gyms and fitness studios, industrial and workshop floors, equestrian areas
      and playgrounds. The same roll is specified across all of these because it
      balances grip, cushioning and durability.
  - question: How do I get roll widths, lengths and thicknesses?
    answer: >-
      Request the Zain Active Rolls specification sheet. It lists the current roll
      widths, lengths, thickness options and granule specification.
