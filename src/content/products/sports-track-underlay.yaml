faqs:
  - question: Which sports surfaces can Zain Prime be installed under?
    answer: >-
      It is compatible with wood, vinyl and synthetic sports and court surfaces.
      The top surface is installed over Zain Prime following that surface
      manufacturer's guidance for use over a resilient underlay.
  - question: What does the underlay do for players?
    answer: >-
      It adds a consistent cushioned layer under the playing surface, which
      absorbs impact during running and jumping, reduces fatigue and helps
      protect joints, while keeping the surface above it stable underfoot.
  - question: Does it also help with noise?
    answer: >-
      Yes. The same resilient layer that cushions impact also reduces the impact
      noise transmitted from the sports surface into the structure and adjoining
      spaces.
  - question: How do I get thickness and density figures?
    answer: >-
      Thickness options, density and roll sizes are listed on the Zain Prime
      technical specification sheet. Request the current sheet and tell us the
      surface and use, and we will recommend a build-up.
