definition: >-
  Zain Fit is a rubber gym floor tile designed for the simplest possible
  installation: the tiles lay straight onto the subfloor and can be lifted and
  relaid without adhesive or specialist labour. That makes them suited to home
  gyms, rented spaces and rooms that change use.

benefits:
  - Install, lift and relay without adhesive or specialist tools
  - Low-labour fit-out and easy section replacement
  - Portable between rooms or premises

