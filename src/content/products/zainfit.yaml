faqs:
  - question: Do Zain Fit tiles need glue?
    answer: >-
      No. They are designed to lay loose onto a clean, level subfloor and stay in
      place by weight and fit, so they can be lifted and relaid. Perimeter
      trims or a bead of adhesive at doorways can be added where needed.
  - question: Can I install them myself?
    answer: >-
      Yes. That is the point of the product — no specialist labour or tools are
      required. Lay them out, cut edge tiles to fit, and the floor is ready to
      use.
  - question: Are they suitable for a commercial gym?
    answer: >-
      They work well in lighter commercial and studio settings and in areas that
      need to be reconfigured. For dedicated heavy lifting zones, use Zain Extreme
      heavy-duty tiles instead.
  - question: How do I get sizes, thickness and colours?
    answer: >-
      Request the Zain Fit specification sheet and a free sample. We will confirm
      the current tile size, thickness options, weight and available colours.
