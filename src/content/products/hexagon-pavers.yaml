faqs:
  - question: Why choose hexagon rubber pavers over concrete?
    answer: >-
      They install without wet trades, cushion each step, stay non-slip when wet
      and can be lifted for access to what is underneath. The hexagonal shape
      also gives a more decorative finish than a plain concrete path.
  - question: Where can they be used?
    answer: >-
      Garden and landscape paths, animal walkways, dairy farm routes and stable
      pathways — anywhere a durable, good-looking, walkable surface is needed
      outdoors.
  - question: How are they laid?
    answer: >-
      The hexagons tile edge to edge over a firm, even base such as compacted
      ground, sand or an existing slab. Edge restraint keeps the field tight on
      loose ground.
  - question: What sizes and colours are available?
    answer: >-
      Request the Zain Hexagon Pavers specification sheet for the current paver
      dimensions, thickness and colour options.
