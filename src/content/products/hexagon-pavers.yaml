tagline: Hexagonal rubber pavers — a softer, quieter alternative to concrete paths.

definition: >-
  Zain Hexagon Pavers are hexagonal rubber paving units that tile together into a
  continuous path. They give gardens, animal walkways, dairy farms and stables a
  durable, non-slip, cushioned surface with a more finished look than poured
  concrete, and individual pavers can be lifted and replaced.

benefits:
  - Hexagonal tiling gives a finished, decorative path surface
  - Cushioned and non-slip underfoot compared with concrete
  - Individual pavers lift out for repair or access
  - Weather-resistant for outdoor use

applications:
  - Garden and landscape pathways
  - Animal walkways
  - Dairy farms
  - Horse stables

