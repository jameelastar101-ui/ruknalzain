faqs:
  - question: What problem do curb stones solve?
    answer: >-
      In free-weight areas, dropped or nudged barbells and plates roll. A line of
      curb stones along the edge of the zone stops them before they hit mirrors,
      glass partitions or nearby machines, and cushions the impact.
  - question: Where are they placed?
    answer: >-
      Along the boundary between the lifting or drop zone and anything that needs
      protecting — mirrored walls, glass, studio partitions or equipment rows.
  - question: Are they fixed down?
    answer: >-
      They are heavy enough to stay put in normal use and are usually placed
      loose so the layout can be changed. They can be bonded down where a
      permanent boundary is wanted.
  - question: How do I get dimensions and weights?
    answer: >-
      Request the Zain Curb Stone specification sheet for the current
      dimensions, unit weight and colour options.
