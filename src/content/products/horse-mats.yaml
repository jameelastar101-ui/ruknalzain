climateNote: >-
  Recycled rubber is dimensionally stable and moisture-resistant, and it
  insulates the animal from the temperature of the slab beneath — useful in
  un-air-conditioned barns through the UAE summer.

faqs:
  - question: Why use rubber mats in a horse stall?
    answer: >-
      They give the horse a non-slip, cushioned floor over hard concrete. That
      reduces the risk of slips, lowers leg and joint fatigue when standing for
      long periods, provides insulation from the slab, and cuts the amount of
      bedding needed.
  - question: Can the same mats be used on a dairy farm?
    answer: >-
      Yes. The non-slip, anti-fatigue and easy-clean properties that suit horse
      stalls also suit dairy standing areas, collecting yards and holding pens.
  - question: How are they cleaned?
    answer: >-
      Sweep out bedding and solids, then hose down. The mats do not absorb water
      and can be lifted for a full wash of the slab underneath when needed.
  - question: What sizes and thicknesses are available?
    answer: >-
      Request the Zain Horse Mats specification sheet for the current mat sizes,
      thickness options and surface textures, plus bulk pricing for multiple
      stalls.
