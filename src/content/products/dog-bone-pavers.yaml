faqs:
  - question: How do dog bone pavers stay in place?
    answer: >-
      Each paver is shaped so it interlocks with the pavers around it, forming a
      continuous surface that resists spreading underfoot. On loose ground they
      can be pinned at the edges; on a hard base they usually sit by weight and
      interlock alone.
  - question: What base do they need?
    answer: >-
      They can be laid over compacted ground, sand or an existing hard surface.
      A firm, even base gives the best result and stops individual pavers
      rocking.
  - question: Are they suitable for animal traffic?
    answer: >-
      Yes. The density and interlock are designed for repeated hoof and wheel
      traffic on walkways, paddock routes and dairy yards, while still cushioning
      each step.
  - question: What sizes and thicknesses are available?
    answer: >-
      Request the Zain Pavers Dog Bone specification sheet for the current paver
      size, thickness and coverage per square metre, plus bulk pricing.
